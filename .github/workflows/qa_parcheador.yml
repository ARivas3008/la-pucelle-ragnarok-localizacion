name: QA motor y formatos
on:
  push:
    paths: ['parcheador/**', '.github/workflows/qa_parcheador.yml']
  pull_request:
    paths: ['parcheador/**', '.github/workflows/qa_parcheador.yml']
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Motor y formatos sin archivos comerciales
        shell: bash
        run: |
          set -e
          python -m unittest discover -s parcheador/app/tests -p 'test_*.py' -v
          for suite in parcheador/investigacion/v*/tests; do
            python -m unittest discover -s "$suite" -p 'test_*.py' -v
          done
