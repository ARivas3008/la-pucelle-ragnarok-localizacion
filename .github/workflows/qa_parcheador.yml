name: QA parcheador experimental
on:
  push:
    paths:
      - 'parcheador/**'
      - '.github/workflows/qa_parcheador.yml'
  pull_request:
    paths:
      - 'parcheador/**'
      - '.github/workflows/qa_parcheador.yml'
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas sin archivos comerciales del motor de inserción
        run: python -m unittest discover -s parcheador/app/tests -p 'test_*.py' -v
      - name: Pruebas de reubicación conservadora y anclas v0.12
        run: python -m unittest discover -s parcheador/investigacion/v0.12/tests -p 'test_*.py' -v
      - name: Pruebas de scripts v0.14
        run: python -m unittest discover -s parcheador/investigacion/v0.14/tests -p 'test_*.py' -v
