name: QA ROM-009 preflight
on:
  push:
    paths:
      - 'parcheador/app/scripts/integracion_total.py'
      - 'tests/test_rom009_preflight.py'
      - '.github/workflows/qa-rom009.yml'
  pull_request:
    paths:
      - 'parcheador/app/scripts/integracion_total.py'
      - 'tests/test_rom009_preflight.py'
      - '.github/workflows/qa-rom009.yml'
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Probar protección de originales sin ISO ni DLC
        run: python -m unittest discover -s tests -p test_rom009_preflight.py -v
