name: QA forense anclas v0.15
on:
  push:
    paths: ['parcheador/investigacion/v0.15/**', '.github/workflows/qa_anclas_v015.yml']
  pull_request:
    paths: ['parcheador/investigacion/v0.15/**', '.github/workflows/qa_anclas_v015.yml']
permissions:
  contents: read
jobs:
  anclas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pruebas de fase sin archivos comerciales
        run: python -m unittest discover -s parcheador/investigacion/v0.15/tests -p 'test_*.py' -v
