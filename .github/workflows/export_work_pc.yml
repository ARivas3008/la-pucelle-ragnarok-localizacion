name: Exportar documentación y fuentes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exportar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exportar el estado solicitado del repositorio
        run: git archive --format=zip --output=LaPucelle_fuentes_documentacion.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: LaPucelle-fuentes-documentacion
          path: LaPucelle_fuentes_documentacion.zip
