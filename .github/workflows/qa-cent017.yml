name: QA CENT-017 generador de nombres
on:
  push:
    paths:
      - 'scripts/cent017_auditar_nombre.py'
      - 'tests/test_cent017_nombre.py'
      - 'scripts/cent018_modelo_nombres.py'
      - 'tests/test_cent018_modelo_nombres.py'
      - 'data/control/CENT018_NAME_DAT_27_PROPUESTAS.csv'
      - 'data/control/CENT019_NAME_DAT_26_JAPONES_PROPUESTAS.csv'
      - '.github/workflows/qa-cent017.yml'
  pull_request:
    paths:
      - 'scripts/cent017_auditar_nombre.py'
      - 'tests/test_cent017_nombre.py'
      - 'scripts/cent018_modelo_nombres.py'
      - 'tests/test_cent018_modelo_nombres.py'
      - 'data/control/CENT018_NAME_DAT_27_PROPUESTAS.csv'
      - 'data/control/CENT019_NAME_DAT_26_JAPONES_PROPUESTAS.csv'
      - '.github/workflows/qa-cent017.yml'
jobs:
  estructura:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar estructura name.dat sin archivos comerciales
        run: |
          python -m py_compile scripts/cent017_auditar_nombre.py scripts/cent018_modelo_nombres.py
          python -m unittest discover -s tests -p 'test_cent01*_*.py' -v
          python scripts/cent018_modelo_nombres.py --propuestas data/control/CENT018_NAME_DAT_27_PROPUESTAS.csv --bases Prier Croix Alouette Culotte Poitreene --informe /tmp/cent018_simulacion.json
          python scripts/cent018_modelo_nombres.py --propuestas data/control/CENT019_NAME_DAT_26_JAPONES_PROPUESTAS.csv --bases Prier Croix Alouette Culotte Poitreene --informe /tmp/cent019_simulacion_sin_edat.json
