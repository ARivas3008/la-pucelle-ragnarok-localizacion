name: QA metodología de localización
on:
  push:
    paths: ['metodologia/**', '.github/workflows/qa_metodologia.yml']
  pull_request:
    paths: ['metodologia/**', '.github/workflows/qa_metodologia.yml']
permissions:
  contents: read
jobs:
  pruebas-metodologia:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s metodologia/tests -p 'test_*.py' -v
