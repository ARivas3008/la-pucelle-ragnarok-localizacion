name: Importar corpus preparados
on:
  push:
    branches: [main]
    paths:
      - '_bootstrap/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clonar repositorio público
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar y comprobar el paquete Git original
        shell: bash
        run: |
          set -euo pipefail
          cat _bootstrap/part_*.bundle-part > /tmp/lapucelle.bundle
          echo '23a69b383dc25eebf8aab75842175e64c3057cd7a44e38e5ca808d38cd6ca3f7  /tmp/lapucelle.bundle' | sha256sum -c -
          git clone --quiet /tmp/lapucelle.bundle /tmp/lapucelle_source
          test "$(git -C /tmp/lapucelle_source ls-files | wc -l)" -eq 122
          python - <<'PY'
          from pathlib import Path
          import subprocess, shutil
          src=Path('/tmp/lapucelle_source')
          root=Path.cwd()
          preserve={
              'README.md',
              'AGENTS.md',
              'CHATGPT_PROJECT_INSTRUCCIONES.md',
              'CONTROL_CALIDAD_Y_REINTEGRACION.md',
              'COORDINACION_FINAL.md'
          }
          paths=subprocess.check_output(['git','-C',str(src),'ls-files','-z']).split(b'\0')
          for raw in paths:
              if not raw: continue
              rel=raw.decode('utf-8')
              if rel in preserve: continue
              from_path=src/rel
              to_path=root/rel
              to_path.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(from_path,to_path)
          print(f'Copiados {len(paths)-1-len(preserve)} archivos de la fuente verificada')
          PY
      - name: Validar todos los corpus y pruebas
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validar.py
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/progreso.py
      - name: Publicar los 15 corpus en main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _bootstrap
          rm -f .github/workflows/importar_corpus.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: publicar 15 corpus, originales, mapas Excel y validadores'
          git push origin HEAD:main
