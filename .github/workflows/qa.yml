name: QA de corpus
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Comprobar estructura, filas, originales y etiquetas
        run: python scripts/validar.py
      - name: Comprobar alcance de PR y revisión estricta de corpus
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git fetch origin "$BASE_SHA"
          python scripts/validar_cambios_pr.py --base "$BASE_SHA" --head "$HEAD_BRANCH"
          if [[ "$HEAD_BRANCH" =~ ^revision/corpus-[0-9]{2}$ ]]; then
            NUMBER="${HEAD_BRANCH##*-}"
            python scripts/validar.py --corpus "$((10#$NUMBER))" --estricto
          fi
      - name: Pruebas de variables y controles
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Publicar progreso
        run: python scripts/progreso.py
