name: QA de inventarios de seguimiento
on:
  push:
    paths:
      - 'docs/seguimiento/**'
      - 'scripts/validar_seguimiento.py'
      - 'scripts/auditar_rom032_consolidacion.py'
      - 'scripts/auditar_rom030_agregado.py'
      - '.github/workflows/qa_seguimiento.yml'
      - 'parcheador/app/tests/test_magic_prefijos_v020.py'
      - 'parcheador/app/scripts/campos_revisados.py'
      - 'parcheador/app/tests/test_talk_opciones_seguras_v020.py'
      - 'scripts/auditar_bgpack_original.py'
      - 'scripts/test_bgpack_auditoria.py'
      - 'scripts/inspeccionar_txp_bgpack.py'
      - 'scripts/test_txp_bgpack.py'
      - 'scripts/auditar_corazon_original.py'
      - 'scripts/test_corazon_original.py'
      - 'scripts/verificar_bgpack_parche.py'
      - 'scripts/test_verificar_bgpack_parche.py'
      - 'scripts/verificar_iso_aislamiento.py'
      - 'scripts/test_verificar_iso_aislamiento.py'
      - 'scripts/verificar_iso_layout_fijo.py'
      - 'scripts/test_verificar_iso_layout_fijo.py'
      - 'scripts/auditar_graficos_manifiesto.py'
      - 'scripts/test_auditar_graficos_manifiesto.py'
      - 'parcheador/app/scripts/revisiones_coordinadas.py'
      - 'parcheador/app/scripts/recompilar_talk.py'
      - 'parcheador/app/scripts/integracion_total.py'
      - 'parcheador/app/datos/segmentos_centrales_anclados.json'
      - 'parcheador/app/tests/test_revisiones_coordinadas.py'
      - 'parcheador/build_release.py'
      - 'parcheador/main.go'
  pull_request:
    paths:
      - 'docs/seguimiento/**'
      - 'scripts/validar_seguimiento.py'
      - 'scripts/auditar_rom032_consolidacion.py'
      - 'scripts/auditar_rom030_agregado.py'
      - '.github/workflows/qa_seguimiento.yml'
      - 'parcheador/app/tests/test_magic_prefijos_v020.py'
      - 'parcheador/app/scripts/campos_revisados.py'
      - 'parcheador/app/tests/test_talk_opciones_seguras_v020.py'
      - 'scripts/auditar_bgpack_original.py'
      - 'scripts/test_bgpack_auditoria.py'
      - 'scripts/inspeccionar_txp_bgpack.py'
      - 'scripts/test_txp_bgpack.py'
      - 'scripts/auditar_corazon_original.py'
      - 'scripts/test_corazon_original.py'
      - 'scripts/verificar_bgpack_parche.py'
      - 'scripts/test_verificar_bgpack_parche.py'
      - 'scripts/verificar_iso_aislamiento.py'
      - 'scripts/test_verificar_iso_aislamiento.py'
      - 'scripts/verificar_iso_layout_fijo.py'
      - 'scripts/test_verificar_iso_layout_fijo.py'
      - 'scripts/auditar_graficos_manifiesto.py'
      - 'scripts/test_auditar_graficos_manifiesto.py'
      - 'parcheador/app/scripts/revisiones_coordinadas.py'
      - 'parcheador/app/scripts/recompilar_talk.py'
      - 'parcheador/app/scripts/integracion_total.py'
      - 'parcheador/app/datos/segmentos_centrales_anclados.json'
      - 'parcheador/app/tests/test_revisiones_coordinadas.py'
      - 'parcheador/build_release.py'
      - 'parcheador/main.go'
permissions:
  contents: read
jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar IDs, corpus, destinos gráficos y contadores
        run: python scripts/validar_seguimiento.py
      - name: Probar conservación de marcadores magic.dat (fixtures sintéticos)
        run: python -m unittest discover -s parcheador/app/tests -p 'test_magic_prefijos_v020.py' -v
      - name: Probar selector talk 14/FD, rechazo parcial y reversibilidad (sintético)
        run: python -m unittest discover -s parcheador/app/tests -p 'test_talk_opciones_seguras_v020.py' -v
      - name: Auditar estructura BGPACK sintética (sin originales)
        run: python -m unittest discover -s scripts -p 'test_bgpack_auditoria.py' -v
      - name: Pruebas sintéticas de TXP 4 y 8 bpp, swizzle y CLUT
        run: python -m unittest discover -s scripts -p 'test_txp_bgpack.py' -v
      - name: Validar CP932 del glifo de corazón y tablas sintéticas
        run: python -m unittest discover -s scripts -p 'test_corazon_original.py' -v
      - name: Rechazar cambios gráficos BGPACK fuera de regiones autorizadas
        run: python -m unittest discover -s scripts -p 'test_verificar_bgpack_parche.py' -v
      - name: Verificar aislamiento ISO9660 con reubicación y permisos de cambios (sintético)
        run: python -m unittest discover -s scripts -p 'test_verificar_iso_aislamiento.py' -v
      - name: Verificar regiones ISO no indexadas con layout fijo
        run: python -m unittest discover -s scripts -p 'test_verificar_iso_layout_fijo.py' -v
      - name: Probar metadatos TXP con alturas parciales y CLUT multibanco
        run: python -m unittest discover -s scripts -p 'test_auditar_graficos_manifiesto.py' -v
      - name: Integrar revisión central y preservar anclas de diálogos recuperados
        run: python -m unittest discover -s parcheador/app/tests -p 'test_revisiones_coordinadas.py' -v
      - name: Conciliar inventarios ROM-030 por ID y adaptaciones EBOOT
        run: python scripts/auditar_rom030_agregado.py

      - name: Verificar evidencias y contabilidad de la rama conservadora ROM-032
        run: python scripts/auditar_rom032_consolidacion.py

      - name: Conciliar inventario y revisiones ROM-033 (sin binarios comerciales)
        run: python scripts/auditar_rom033_iso_talk.py
