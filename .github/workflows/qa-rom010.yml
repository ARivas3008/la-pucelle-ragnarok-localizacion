name: QA ROM-010 ISO sola
on:
  push:
    paths:
      - 'scripts/auditar_entrega.py'
      - 'tests/test_rom010_iso_sola.py'
      - 'scripts/umbral_rom012.py'
      - 'tests/test_rom012_umbral.py'
      - 'scripts/rom013_auditar_talk_original.py'
      - 'tests/test_rom013_centrales.py'
      - 'tests/test_rom014_original_sha.py'
      - 'scripts/rom015_auditar_campos_y_scripts_iso.py'
      - 'tests/test_rom015_cadenas_iso.py'
      - '.github/workflows/qa-rom010.yml'
  pull_request:
    paths:
      - 'scripts/auditar_entrega.py'
      - 'tests/test_rom010_iso_sola.py'
      - 'scripts/umbral_rom012.py'
      - 'tests/test_rom012_umbral.py'
      - 'scripts/rom013_auditar_talk_original.py'
      - 'tests/test_rom013_centrales.py'
      - 'tests/test_rom014_original_sha.py'
      - 'scripts/rom015_auditar_campos_y_scripts_iso.py'
      - 'tests/test_rom015_cadenas_iso.py'
      - '.github/workflows/qa-rom010.yml'
jobs:
  alcance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validar sintaxis y regresiones ISO/DLC
        run: |
          python -m py_compile scripts/auditar_entrega.py scripts/umbral_rom012.py scripts/rom013_auditar_talk_original.py scripts/rom015_auditar_campos_y_scripts_iso.py
          python -m unittest discover -s tests -p 'test_rom01*.py' -v
